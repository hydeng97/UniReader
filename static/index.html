        async function extractFromUrl() {
            const url = document.getElementById('pdf-url').value.trim();
            if (!url) return;
            
            currentPaperId = null;
            currentBranchId = null;
            branches = [];
            
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('branches-panel').style.display = 'none';
            document.getElementById('branches-list').innerHTML = '';
            document.getElementById('chat-area').style.display = 'flex';
            renderBranches();
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div class="message"><div class="message-content">正在提交解析任务...</div></div>';
            
            const res = await fetch('/api/papers/extract-url', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url})
            });
            
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let paperId = null;
            
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                const text = decoder.decode(value);
                const lines = text.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const dataStr = line.slice(6);
                        if (dataStr === '[DONE]') continue;
                        
                        let data;
                        try {
                            data = JSON.parse(dataStr);
                        } catch (e) {
                            console.warn('Failed to parse SSE data:', dataStr);
                            continue;
                        }
                        
                        if (data.status === 'started') {
                            paperId = data.paper_id;
                            currentPaperId = paperId;
                            currentBranchId = null;
                            branches = [];
                            
                            document.getElementById('current-paper-name').textContent = data.filename || '文档';
                            document.getElementById('edit-title-btn').style.display = 'inline-block';
                            document.getElementById('analyze-btn').style.display = 'none';
                            document.getElementById('new-branch-dropdown').style.display = 'none';
                            document.getElementById('summarize-dropdown').style.display = 'none'; document.getElementById('new-window-btn').style.display = 'none';
                            
                            messagesDiv.innerHTML = '<div class="message"><div class="message-content"><div style="display:flex;align-items:center;gap:8px"><div class="loading"></div><span>正在解析文件...</span></div></div></div>';
                            
                            fetchPapers().then(() => renderPaperList());
                        }
                        
                        if (currentPaperId !== paperId) continue;
                        
                        if (data.status === 'done') {
                            let titleMsg = data.title_extracted ? '（已自动提取标题）' : '';
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content" style="color:#1a7f37">✓ 解析完成${titleMsg}！点击"开始分析"进行论文解读，或点击"新建分支"手动创建对话</div></div>`;
                            document.getElementById('analyze-btn').style.display = 'inline-block';
                            document.getElementById('new-branch-dropdown').style.display = 'inline-block';
                            if (data.filename) {
                                document.getElementById('current-paper-name').textContent = data.filename;
                            }
                            fetchPapers().then(() => renderPaperList());
                        } else if (data.status === 'created') {
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content">
                                <div style="display:flex;align-items:center;gap:8px">
                                    <div class="loading"></div>
                                    <span>任务已创建，任务ID: ${data.task_id}</span>
                                </div>
                                <br><button class="btn" style="margin-top:8px" onclick="useLocalExtractionFromUrl('${paperId}', '${url}')">使用本地解析</button>
                            </div></div>`;
                        } else if (data.status === 'pending') {
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content">
                                <div style="display:flex;align-items:center;gap:8px">
                                    <div class="loading"></div>
                                    <span>任务排队中，请稍候...</span>
                                </div>
                                <br><button class="btn" style="margin-top:8px" onclick="useLocalExtractionFromUrl('${paperId}', '${url}')">使用本地解析</button>
                            </div></div>`;
                        } else if (data.status === 'running') {
                            const progress = data.progress || {};
                            const extracted = progress.extracted_pages || 0;
                            const total = progress.total_pages || 0;
                            const percent = total > 0 ? Math.round((extracted / total) * 100) : 0;
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content">
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                                    <div class="loading"></div>
                                    <span>正在解析PDF...</span>
                                </div>
                                <div>已解析: ${extracted}/${total} 页 (${percent}%)</div>
                                <div class="progress-bar" style="margin-top:8px"><div class="progress-bar-fill" style="width:${percent}%"></div></div>
                                <br><button class="btn" style="margin-top:8px" onclick="useLocalExtractionFromUrl('${paperId}', '${url}')">使用本地解析</button>
                            </div></div>`;
                        } else if (data.status === 'converting') {
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content">
                                <div style="display:flex;align-items:center;gap:8px">
                                    <div class="loading"></div>
                                    <span>正在转换格式...</span>
                                </div>
                            </div></div>`;
                        } else if (data.status === 'local') {
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content">
                                <div style="display:flex;align-items:center;gap:8px">
                                    <div class="loading"></div>
                                    <span>${data.message}</span>
                                </div>
                            </div></div>`;
                        } else if (data.status === 'error') {
                            const errorMsg = data.message || '未知错误';
                            messagesDiv.innerHTML = `<div class="message"><div class="message-content" style="color:#cf222e">✗ ${errorMsg}</div></div>`;
                            useLocalExtractionFromUrl(paperId, url, errorMsg);
                        }
                    }
                }
            }
        }
        
        async function useLocalExtractionFromUrl(paperId, pdfUrl, errorMsg = '') {
            const messagesDiv = document.getElementById('messages');
            const errorHtml = errorMsg ? `<div class="message"><div class="message-content" style="color:#cf222e;margin-bottom:8px">✗ ${errorMsg}</div></div>` : '';
            messagesDiv.innerHTML = errorHtml + '<div class="message"><div class="message-content"><div style="display:flex;align-items:center;gap:8px"><div class="loading"></div><span>正在使用本地解析器...</span></div></div></div>';
            
            try {
                const res = await fetch('/api/papers/extract-url-local', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({paper_id: paperId, url: pdfUrl})
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6);
                            if (dataStr === '[DONE]') continue;
                            
                            try {
                                const data = JSON.parse(dataStr);
                                
                                if (data.status === 'done') {
                                    let titleMsg = data.title_extracted ? '（已自动提取标题）' : '';
                                    messagesDiv.innerHTML = `<div class="message"><div class="message-content" style="color:#1a7f37">✓ 解析完成${titleMsg}！点击"开始分析"进行论文解读，或点击"新建分支"手动创建对话</div></div>`;
                                    document.getElementById('analyze-btn').style.display = 'inline-block';
                                    document.getElementById('new-branch-dropdown').style.display = 'inline-block';
                                    if (data.filename) {
                                        document.getElementById('current-paper-name').textContent = data.filename;
                                    }
                                    fetchPapers().then(() => renderPaperList());
                                } else if (data.status === 'error') {
                                    messagesDiv.innerHTML = errorHtml + `<div class="message"><div class="message-content" style="color:#cf222e">✗ ${data.message}</div></div>`;
                                }
                            } catch (parseErr) {
                                console.warn('Failed to parse SSE data:', dataStr);
                            }
                        }
                    }
                }
            } catch (e) {
                messagesDiv.innerHTML = errorHtml + `<div class="message"><div class="message-content" style="color:#cf222e">✗ 本地解析失败: ${e.message}</div></div>`;
            }
        }

        async function analyzePaper() {
            const analyzingPaperId = currentPaperId;
            if (!analyzingPaperId) return;
            
            const existingBranches = JSON.parse(JSON.stringify(branches));
            const existingCurrentBranchId = currentBranchId;
            
            analyzingPapers.set(analyzingPaperId, {
                branches: existingBranches,
                currentBranchId: existingCurrentBranchId,
                eventSource: null,
                completed: 0,
                total: 0
            });
            
            document.getElementById('branches-panel').style.display = 'flex';
            document.getElementById('summarize-dropdown').style.display = 'none'; document.getElementById('new-window-btn').style.display = 'none';
            
            const eventSource = new EventSource(`/api/papers/${analyzingPaperId}/analyze`);
            const state = analyzingPapers.get(analyzingPaperId);
            if (state) state.eventSource = eventSource;
            
            eventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                const state = analyzingPapers.get(analyzingPaperId);
                if (!state) return;
                
                if (data.status === 'starting') {
                    state.total++;
                    const existingBranch = state.branches.find(b => b.id === data.branch_id);
                    if (!existingBranch) {
                        state.branches.push({
                            id: data.branch_id, 
                            name: data.prompt_name, 
                            messages: [{
                                id: 'msg_' + data.branch_id,
                                role: 'assistant',
                                content: '',
                                timestamp: new Date().toISOString(),
                                is_initial: true,
                                prompt_name: data.prompt_name,
                                model_name: data.model_name,
                                _loading: true,
                                _streaming: true
                            }]
                        });
                    }
                    if (!state.currentBranchId) {
                        state.currentBranchId = data.branch_id;
                    }
                    
                    if (currentPaperId === analyzingPaperId) {
                        branches = JSON.parse(JSON.stringify(state.branches));
                        currentBranchId = state.currentBranchId;
                        renderBranches();
                        renderMessages();
                    }
                } else if (data.chunk) {
                    const branch = state.branches.find(b => b.id === data.branch_id);
                    if (branch && branch.messages.length > 0) {
                        const streamingMsg = branch.messages.find(m => m._streaming);
                        if (streamingMsg) {
                            streamingMsg.content += data.chunk;
                            streamingMsg._loading = false;
                        }
                    }
                    
                    if (currentPaperId === analyzingPaperId && currentBranchId === data.branch_id) {
                        branches = JSON.parse(JSON.stringify(state.branches));
                        renderMessages();
                    }
                } else if (data.done && data.message) {
                    state.completed++;
                    const branch = state.branches.find(b => b.id === data.branch_id);
                    if (branch) {
                        const streamingMsg = branch.messages.find(m => m._streaming);
                        if (streamingMsg) {
                            streamingMsg._streaming = false;
                            streamingMsg._complete = true;
                            streamingMsg.id = data.message.id;
                            streamingMsg.content = data.message.content;
                            streamingMsg.model_name = data.message.model_name;
                            streamingMsg.context_tokens = data.message.context_tokens;
                        }
                    }
                    
                    if (currentPaperId === analyzingPaperId) {
                        branches = JSON.parse(JSON.stringify(state.branches));
                        renderMessages();
                    }
                    
                    if (state.completed >= state.total && state.total > 0) {
                        analyzingPapers.delete(analyzingPaperId);
                        document.getElementById('summarize-dropdown').style.display = 'inline-block'; document.getElementById('new-window-btn').style.display = 'inline-block';
                        document.getElementById('new-branch-dropdown').style.display = 'inline-block';
                    }
                } else if (data.error) {
                    state.completed++;
                    console.error('Analysis error:', data.error);
                    const branch = state.branches.find(b => b.id === data.branch_id);
                    if (branch) {
                        const streamingMsg = branch.messages.find(m => m._streaming);
                        if (streamingMsg) {
                            streamingMsg.content = '❌ 分析失败: ' + data.error;
                            streamingMsg._streaming = false;
                            streamingMsg._loading = false;
                        }
                    }
                    
                    if (currentPaperId === analyzingPaperId && currentBranchId === data.branch_id) {
                        branches = JSON.parse(JSON.stringify(state.branches));
                        renderMessages();
                    }
                    
                    if (state.completed >= state.total && state.total > 0) {
                        analyzingPapers.delete(analyzingPaperId);
                        document.getElementById('summarize-dropdown').style.display = 'inline-block'; document.getElementById('new-window-btn').style.display = 'inline-block';
                    }
                }
            };
            
            eventSource.onerror = () => {
                eventSource.close();
                const state = analyzingPapers.get(analyzingPaperId);
                if (state) {
                    state.branches.forEach(branch => {
                        branch.messages.forEach(m => {
                            if (m._streaming) {
                                m._streaming = false;
                                m._loading = false;
                            }
                        });
                    });
                    if (currentPaperId === analyzingPaperId) {
                        branches = JSON.parse(JSON.stringify(state.branches));
                        renderMessages();
                    }
                }
                analyzingPapers.delete(analyzingPaperId);
                document.getElementById('summarize-dropdown').style.display = 'inline-block'; document.getElementById('new-window-btn').style.display = 'inline-block';
            };
        }
        
        function stopGeneration(paperId) {
            const state = analyzingPapers.get(paperId);
            if (state && state.eventSource) {
                state.eventSource.close();
                state.branches.forEach(branch => {
                    branch.messages.forEach(m => {
                        if (m._streaming) {
                            m._streaming = false;
                            m._loading = false;
                            if (!m.content) m.content = '已停止生成';
                        }
                    });
                });
                if (currentPaperId === paperId) {
                    branches = JSON.parse(JSON.stringify(state.branches));
                    renderMessages();
                }
                analyzingPapers.delete(paperId);
                document.getElementById('summarize-dropdown').style.display = 'inline-block'; document.getElementById('new-window-btn').style.display = 'inline-block';
                document.getElementById('new-branch-dropdown').style.display = 'inline-block';
            }
        }

        function editQuestion(msgId, branchId) {
            const branch = branches.find(b => b.id === branchId);
            if (!branch) return;
            
            const msgIdx = branch.messages.findIndex(m => m.id === msgId);
            if (msgIdx < 0) return;
            
            const msg = branch.messages[msgIdx];
            if (msg.role !== 'user') return;
            
            const newQuestion = prompt('编辑问题:', msg.content);
            if (newQuestion === null || newQuestion.trim() === '' || newQuestion.trim() === msg.content) return;
            
            regenerateQuestion(msgId, branchId, newQuestion.trim());
        }

        async function regenerateQuestion(msgId, branchId, newQuestion) {
            if (!currentPaperId) return;
            
            if (askingQuestions.size >= clientConfig.max_concurrent_requests) {
                alert('请等待当前请求完成后再提问');
                return;
            }
            
            const questionId = Date.now().toString();
            const askingBranchId = branchId;
            const askingPaperId = currentPaperId;
            
            saveAskingPaperState();
            
            askingQuestions.set(questionId, {
                paperId: askingPaperId,
                branchId: askingBranchId,
                reader: null,
                userMsgId: msgId,
                assistantMsgId: null,
                startTime: Date.now()
            });
            
            const branch = branches.find(b => b.id === askingBranchId);
            if (!branch) {
                askingQuestions.delete(questionId);
                return;
            }
            
            const msgIdx = branch.messages.findIndex(m => m.id === msgId);
            if (msgIdx < 0) {
                askingQuestions.delete(questionId);
                return;
            }
            
            branch.messages[msgIdx].content = newQuestion;
            
            while (msgIdx + 1 < branch.messages.length && branch.messages[msgIdx + 1].role === 'assistant') {
                branch.messages.splice(msgIdx + 1, 1);
            }
            
            const tempAssistantId = 'temp_assistant_' + questionId;
            branch.messages.splice(msgIdx + 1, 0, {
                id: tempAssistantId,
                role: 'assistant',
                content: '',
                timestamp: new Date().toISOString(),
                model_name: 'AI',
                _loading: true,
                _streaming: true,
                _pendingId: tempAssistantId,
                _questionId: questionId
            });
            
            const qState = askingQuestions.get(questionId);
            if (qState) qState.assistantMsgId = tempAssistantId;
            
            updateAskingPaperState(askingPaperId, askingBranchId, branch);
            if (currentBranchId === askingBranchId) {
                renderMessages();
            }
            
            try {
                const res = await fetch('/api/papers/' + askingPaperId + '/regenerate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        paper_id: askingPaperId,
                        branch_id: askingBranchId,
                        message_id: msgId,
                        new_question: newQuestion
                    })
                });
                
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                
                const reader = res.body.getReader();
                const qState = askingQuestions.get(questionId);
                if (qState) qState.reader = reader;
                
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    if (!askingQuestions.has(questionId)) {
                        break;
                    }
                    
                    const qState = askingQuestions.get(questionId);
                    if (Date.now() - qState.startTime > 300000) {
                        console.warn('Request timeout:', questionId);
                        askingQuestions.delete(questionId);
                        break;
                    }
                    
                    let readResult;
                    try {
                        readResult = await Promise.race([
                            reader.read(),
                            new Promise((_, reject) => 
                                setTimeout(() => reject(new Error('Read timeout')), 60000)
                            )
                        ]);
                    } catch (readError) {
                        console.warn('Read error:', readError);
                        const errQState = askingQuestions.get(questionId);
                        if (errQState) {
                            const errorBranch = branches.find(b => b.id === errQState.branchId);
                            if (errorBranch && errQState.assistantMsgId) {
                                const errorMsg = errorBranch.messages.find(m => m.id === errQState.assistantMsgId || m._pendingId === errQState.assistantMsgId);
                                if (errorMsg) {
                                    errorMsg._streaming = false;
                                    errorMsg._loading = false;
                                    if (!errorMsg.content || errorMsg.content.trim() === '') {
                                        errorMsg.content = '❌ 读取超时，请重试';
                                    }
                                }
                                updateAskingPaperState(errQState.paperId, errQState.branchId, errorBranch);
                                if (currentPaperId === errQState.paperId && currentBranchId === errQState.branchId) {
                                    renderMessages();
                                }
                            }
                            askingQuestions.delete(questionId);
                        }
                        break;
                    }
                    
                    const {done, value} = readResult;
                    if (done) break;
                    
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        if (!line.startsWith('data: ')) continue;
                        
                        const dataStr = line.slice(6);
                        if (dataStr === '[DONE]') continue;
                        
                        let data;
                        try {
                            data = JSON.parse(dataStr);
                        } catch (e) {
                            console.warn('Failed to parse SSE data:', dataStr, e);
                            continue;
                        }
                        
                        const currentQState = askingQuestions.get(questionId);
                        let branch = branches.find(b => b.id === askingBranchId);
                        
                        if (!branch) {
                            console.warn('Branch not found:', askingBranchId);
                            continue;
                        }
                        
                        if (data.status === 'started') {
                            const oldAssistantMsgId = currentQState?.assistantMsgId;
                            const newAssistantMsgId = data.assistant_msg_id;
                            
                            if (newAssistantMsgId && oldAssistantMsgId) {
                                const msg = branch.messages.find(m => m.id === oldAssistantMsgId || m._pendingId === oldAssistantMsgId);
                                if (msg) {
                                    msg.id = newAssistantMsgId;
                                    msg._pendingId = newAssistantMsgId;
                                    msg.model_name = data.model_name;
                                    const qState = askingQuestions.get(questionId);
                                    if (qState) qState.assistantMsgId = newAssistantMsgId;
                                }
                            } else if (oldAssistantMsgId) {
                                const msg = branch.messages.find(m => m.id === oldAssistantMsgId || m._pendingId === oldAssistantMsgId);
                                if (msg) {
                                    msg.model_name = data.model_name;
                                }
                            }
                            updateAskingPaperState(askingPaperId, askingBranchId, branch);
                            if (currentPaperId === askingPaperId && currentBranchId === askingBranchId) {
                                renderMessages();
                            }
                        } else if (data.chunk) {
                            const assistantMsgId = currentQState?.assistantMsgId;
                            if (assistantMsgId) {
                                const msg = branch.messages.find(m => m.id === assistantMsgId || m._pendingId === assistantMsgId);
                                if (msg && msg.role === 'assistant') {
                                    msg._loading = false;
                                    msg.content += data.chunk;
                                }
                                updateAskingPaperState(askingPaperId, askingBranchId, branch);
                                if (currentPaperId === askingPaperId && currentBranchId === askingBranchId) {
                                    renderMessages();
                                }
                            }
                        } else if (data.done && data.message) {
                            const assistantMsgId = currentQState?.assistantMsgId;
                            if (assistantMsgId) {
                                const msg = branch.messages.find(m => m.id === assistantMsgId || m._pendingId === assistantMsgId);
                                if (msg) {
                                    msg._streaming = false;
                                    msg._complete = true;
                                    msg.id = data.message.id;
                                    msg.content = data.message.content;
                                    msg.model_name = data.message.model_name;
                                    msg.context_tokens = data.message.context_tokens;
                                }
                                updateAskingPaperState(askingPaperId, askingBranchId, branch);
                                if (currentPaperId === askingPaperId && currentBranchId === askingBranchId) {
                                    renderMessages();
                                }
                            }
                            askingQuestions.delete(questionId);
                        } else if (data.error) {
                            const assistantMsgId = currentQState?.assistantMsgId;
                            if (assistantMsgId) {
                                const msg = branch.messages.find(m => m.id === assistantMsgId || m._pendingId === assistantMsgId);
                                if (msg) {
                                    msg._streaming = false;
                                    msg._loading = false;
                                    msg.content = '❌ 请求失败: ' + data.error;
                                }
                                updateAskingPaperState(askingPaperId, askingBranchId, branch);
                                if (currentPaperId === askingPaperId && currentBranchId === askingBranchId) {
                                    renderMessages();
                                }
                            }
                            askingQuestions.delete(questionId);
                        }
                    }
                }
            } catch (e) {
                console.error('regenerateQuestion error:', e);
                const qState = askingQuestions.get(questionId);
                if (qState) {
                    const branch = branches.find(b => b.id === qState.branchId);
                    if (branch && qState.assistantMsgId) {
                        const msg = branch.messages.find(m => m.id === qState.assistantMsgId || m._pendingId === qState.assistantMsgId);
                        if (msg) {
                            msg._streaming = false;
                            msg._loading = false;
                            msg.content = '❌ 请求失败: ' + e.message;
                        }
                        updateAskingPaperState(qState.paperId, qState.branchId, branch);
                        if (currentPaperId === qState.paperId && currentBranchId === qState.branchId) {
                            renderMessages();
                        }
                    }
                    askingQuestions.delete(questionId);
                }
            }
        }

                                const qState = askingQuestions.get(questionId);
                                const assistantMsgId = qState?.assistantMsgId;
                                if (assistantMsgId) {
                                    const msg = branch.messages.find(m => m.id === assistantMsgId || m._pendingId === assistantMsgId);
                                    if (msg) {
                                        msg._streaming = false;
                                        msg._loading = false;
                                        msg.content = '❌ 请求失败: ' + data.error;
                                    }
                                    updateAskingPaperState(askingPaperId, actualBranchId, branch);
                                    if (currentPaperId === askingPaperId && currentBranchId === actualBranchId) {
                                        renderMessages();
                                    }
                                }
                                askingQuestions.delete(questionId);
                            }
                    }
                }
            } catch (e) {
                console.error('askQuestion error:', e);
                const qState = askingQuestions.get(questionId);
                if (!qState) return;
                
                const askingBranchIdLocal = qState.branchId;
                const askingPaperIdLocal = qState.paperId;
                const assistantMsgId = qState.assistantMsgId;
                
                let branch;
                if (currentPaperId === askingPaperIdLocal) {
                    branch = branches.find(b => b.id === askingBranchIdLocal);
                }
                if (!branch) {
                    const savedState = askingPapers.get(askingPaperIdLocal);
                    if (savedState) {
                        branch = savedState.branches.find(b => b.id === askingBranchIdLocal);
                    }
                }
                
                if (branch && assistantMsgId) {
                    const msg = branch.messages.find(m => m._pendingId === assistantMsgId);
                    if (msg) {
                        msg._streaming = false;
                        msg._loading = false;
                        msg.content = '❌ 请求失败: ' + e.message;
                    }
                    updateAskingPaperState(askingPaperIdLocal, askingBranchIdLocal, branch);
                    if (currentPaperId === askingPaperIdLocal && currentBranchId === askingBranchIdLocal) {
                        renderMessages();
                    }
                }
                askingQuestions.delete(questionId);
            }
        }
        
        function stopQuestion(questionId) {
            const state = askingQuestions.get(questionId);
            if (!state) return;
            
            if (state.reader) {
                try {
                    state.reader.cancel();
                } catch (e) {
                    console.warn('Error cancelling reader:', e);
                }

            const askingPaperIdLocal = state.paperId;

            let branch;
            if (currentPaperId === askingPaperIdLocal) {
                branch = branches.find(b => b.id === askingBranchIdLocal);

            }
            
            if (branch) {
                const msg = branch.messages.find(m => m._questionId === questionId);
                if (msg) {
                    msg._streaming = false;
                    msg._loading = false;
                    if (!msg.content) msg.content = '已停止生成';
                }
                updateAskingPaperState(askingPaperIdLocal, askingBranchIdLocal, branch);
                if (currentPaperId === askingPaperIdLocal && currentBranchId === askingBranchIdLocal) {
                    renderMessages();

            }
            askingQuestions.delete(questionId);

        async function summarize(allBranches) {
            if (!currentPaperId) return;
            if (!allBranches && !currentBranchId) return;
            
            if (summarizingRequests.size >= clientConfig.max_concurrent_requests) {
                alert('请等待当前请求完成后再总结');
                return;
            }
            
            const summarizePaperId = currentPaperId;
            const summarizeBranchId = currentBranchId;
            const requestId = Date.now().toString();
            
            summarizingRequests.set(requestId, {
                paperId: summarizePaperId,
                branchId: summarizeBranchId,
                reader: null,
                msgId: null,
                startTime: Date.now()
            });
            
            saveAskingPaperState();
            
            try {
                const requestBody = {
                    paper_id: summarizePaperId,
                    all_branches: allBranches
                };
                if (!allBranches && summarizeBranchId) {
                    requestBody.branch_id = summarizeBranchId;
                }
                
                const res = await fetch('/api/papers/' + summarizePaperId + '/summarize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(requestBody)
                });
                
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                
                const reader = res.body.getReader();
                const sState = summarizingRequests.get(requestId);
                if (sState) sState.reader = reader;
                
                const decoder = new TextDecoder();
                let buffer = '';
                let actualBranchId = summarizeBranchId;
                
                while (true) {
                    if (!summarizingRequests.has(requestId)) {
                        break;
                    }
                    
                    const sState = summarizingRequests.get(requestId);
                    if (Date.now() - sState.startTime > 300000) {
                        console.warn('Summarize request timeout:', requestId);
                        summarizingRequests.delete(requestId);
                        break;
                    }
                    
                    let readResult;
                    try {
                        readResult = await Promise.race([
                            reader.read(),
                            new Promise((_, reject) => 
                                setTimeout(() => reject(new Error('Read timeout')), 60000)
                            )
                        ]);
                    } catch (readError) {
                        console.warn('Read error:', readError);
                        const errSState = summarizingRequests.get(requestId);
                        if (errSState) {
                            const errorBranch = branches.find(b => b.id === errSState.branchId);
                            if (errorBranch && errSState.msgId) {
                                const errorMsg = errorBranch.messages.find(m => m.id === errSState.msgId);
                                if (errorMsg) {
                                    errorMsg._streaming = false;
                                    if (!errorMsg.content || errorMsg.content.trim() === '') {
                                        errorMsg.content = '❌ 读取超时，请重试';
                                    }
                                }
                                updateAskingPaperState(errSState.paperId, errSState.branchId, errorBranch);
                                if (currentPaperId === errSState.paperId && currentBranchId === errSState.branchId) {
                                    renderMessages();
                                }
                            }
                            summarizingRequests.delete(requestId);
                        }
                        break;
                    }
                    
                    const {done, value} = readResult;
                    if (done) break;
                    
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        if (!line.startsWith('data: ')) continue;
                        
                        const dataStr = line.slice(6);
                        if (dataStr === '[DONE]') continue;
                        
                        let data;
                        try {
                            data = JSON.parse(dataStr);
                        } catch (e) {
                            console.warn('Failed to parse SSE data:', dataStr, e);
                            continue;
                        }
                        
                        if (data.branch_id && data.branch_id !== actualBranchId) {
                            actualBranchId = data.branch_id;
                            const sState = summarizingRequests.get(requestId);
                            if (sState) sState.branchId = actualBranchId;
                        }
                        
                        let branch = branches.find(b => b.id === actualBranchId);
                        
                        if (!branch) {
                            branch = {
                                id: actualBranchId,
                                name: '总结',
                                messages: [],
                                created_at: new Date().toISOString()
                            };
                            branches.push(branch);
                            if (currentPaperId === summarizePaperId) {
                                currentBranchId = actualBranchId;
                            }
                            renderBranches();
                        }
                        
                        if (data.status === 'started') {
                            const msgId = data.msg_id;
                            const sState = summarizingRequests.get(requestId);
                            if (sState) sState.msgId = msgId;
                            
                            const existingMsg = branch.messages.find(m => m.id === msgId);
                            if (!existingMsg) {
                                branch.messages.push({
                                    id: msgId,
                                    role: 'assistant',
                                    content: '',
                                    timestamp: new Date().toISOString(),
                                    model_name: data.model_name,
                                    context_tokens: data.context_tokens,
                                    _streaming: true,
                                    _summarizeId: requestId
                                });
                            }
                            
                            updateAskingPaperState(summarizePaperId, actualBranchId, branch);
                            
                            if (currentPaperId === summarizePaperId && currentBranchId === actualBranchId) {
                                renderMessages();
                            }
                        } else if (data.chunk) {
                            const sState = summarizingRequests.get(requestId);
                            const msgId = sState?.msgId;
                            if (msgId) {
                                const msg = branch.messages.find(m => m.id === msgId);
                                if (msg && msg.role === 'assistant') {
                                    msg.content += data.chunk;
                                }
                                updateAskingPaperState(summarizePaperId, actualBranchId, branch);
                                if (currentPaperId === summarizePaperId && currentBranchId === actualBranchId) {
                                    renderMessages();
                                }
                            }
                        } else if (data.done && data.message) {
                            const sState = summarizingRequests.get(requestId);
                            const msgId = sState?.msgId;
                            if (msgId) {
                                const msg = branch.messages.find(m => m.id === msgId);
                                if (msg) {
                                    msg._streaming = false;
                                    msg._complete = true;
                                    msg.content = data.message.content;
                                    msg.model_name = data.message.model_name;
                                    msg.context_tokens = data.message.context_tokens;
                                }
                                updateAskingPaperState(summarizePaperId, actualBranchId, branch);
                                if (currentPaperId === summarizePaperId && currentBranchId === actualBranchId) {
                                    renderMessages();
                                }
                            }
                            summarizingRequests.delete(requestId);
                        } else if (data.error) {
                            const sState = summarizingRequests.get(requestId);
                            const msgId = sState?.msgId;
                            if (msgId) {
                                const msg = branch.messages.find(m => m.id === msgId);
                                if (msg) {
                                    msg._streaming = false;
                                    msg.content = '❌ 总结失败: ' + data.error;
                                }
                                updateAskingPaperState(summarizePaperId, actualBranchId, branch);
                                if (currentPaperId === summarizePaperId && currentBranchId === actualBranchId) {
                                    renderMessages();
                                }
                            }
                            summarizingRequests.delete(requestId);
                        }
                    }
                }
            } catch (e) {
                console.error('summarize error:', e);
                const sState = summarizingRequests.get(requestId);
                if (!sState) return;
                
                const branch = branches.find(b => b.id === sState.branchId);
                if (branch && sState.msgId) {
                    const msg = branch.messages.find(m => m.id === sState.msgId);
                    if (msg) {
                        msg._streaming = false;
                        msg.content = '❌ 总结失败: ' + e.message;
                    }
                    updateAskingPaperState(sState.paperId, sState.branchId, branch);
                    if (currentPaperId === sState.paperId && currentBranchId === sState.branchId) {
                        renderMessages();
                    }
                }
                summarizingRequests.delete(requestId);
            }
        }
        
        function stopSummarize(summarizeId) {
            const state = summarizingRequests.get(summarizeId);
            if (!state) return;
            
            if (state.reader) {
                try {
                    state.reader.cancel();
                } catch (e) {
                    console.warn('Error cancelling reader:', e);
                }
            }
            
            const branch = branches.find(b => b.id === state.branchId);
            if (branch && state.msgId) {
                const msg = branch.messages.find(m => m.id === state.msgId);
                if (msg) {

                    }
                }
                updateAskingPaperState(state.paperId, state.branchId, branch);
                if (currentPaperId === state.paperId && currentBranchId === state.branchId) {
                    renderMessages();
                }
            }
            
            summarizingRequests.delete(summarizeId);
        }

支持两种格式：

1. 简单数组格式（只包含链接）：
[
  "https://arxiv.org/pdf/2502.21321",
  "https://example.com/paper.pdf"
]

2. 详细对象数组格式：

  }
]

注意：
- arXiv 摘要链接（/abs/）会自动转换为 PDF 链接（/pdf/）

        let batchImportState = {
            total: 0,
            completed: 0,
            failed: 0,
            running: false,
            queue: [],
            results: []
        };
        
        function convertToPdfUrl(url) {
            if (!url) return null;
            
            url = url.trim();
            
            // arXiv abs -> PDF
            const arxivAbsMatch = url.match(/arxiv\.org\/abs\/(\d+\.\d+)/i);
            if (arxivAbsMatch) {
                return `https://arxiv.org/pdf/${arxivAbsMatch[1]}`;
            }
            
            // arXiv pdf already
            if (url.match(/arxiv\.org\/pdf\//i)) {
                return url;
            }
            
            // OpenReview
            if (url.includes('openreview.net/forum?id=')) {
                const idMatch = url.match(/id=([^&]+)/);
                if (idMatch) {
                    return `https://openreview.net/pdf?id=${idMatch[1]}`;
                }
            }
            
            // ACL Anthology
            if (url.includes('aclanthology.org/') && !url.endsWith('.pdf')) {
                return url.replace(/\/$/, '') + '.pdf';
            }
            
            return url;
        }
        
        async function handleBatchImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                const text = await file.text();
                let papers = JSON.parse(text);
                
                if (!Array.isArray(papers)) {
                    alert('JSON 文件格式错误：需要一个数组');
                    return;
                }
                
                const urls = [];
                for (const item of papers) {
                    let url, title;
                    if (typeof item === 'string') {
                        url = item;
                    } else if (item && typeof item === 'object') {
                        url = item.link || item.url || item.pdf_url;
                        title = item.title;
                    }
                    
                    if (url) {
                        const pdfUrl = convertToPdfUrl(url);
                        if (pdfUrl) {
                            urls.push({ url: pdfUrl, title: title || null });
                        }
                    }
                }
                
                if (urls.length === 0) {
                    alert('未找到有效的论文链接');
                    return;
                }
                
                if (!confirm(`发现 ${urls.length} 个论文链接，是否开始批量导入？`)) {
                    return;
                }
                
                startBatchImport(urls);
            } catch (e) {
                alert('解析 JSON 文件失败: ' + e.message);
            }
            
            event.target.value = '';
        }
        
        async function startBatchImport(urls) {
            batchImportState = {
                total: urls.length,
                completed: 0,
                failed: 0,
                running: true,
                queue: [...urls],
                results: []
            };
            
            document.getElementById('batch-import-status').style.display = 'block';
            updateBatchImportProgress();
            
            const concurrency = clientConfig.max_concurrent_requests;
            const workers = [];
            
            for (let i = 0; i < concurrency; i++) {
                workers.push(batchImportWorker());
            }
            
            await Promise.all(workers);
            
            batchImportState.running = false;
            updateBatchImportProgress();
            
            const successCount = batchImportState.results.filter(r => r.success).length;
            const failCount = batchImportState.results.filter(r => !r.success).length;
            
            alert(`批量导入完成！\n成功: ${successCount}\n失败: ${failCount}`);
            
            await fetchPapers();
            renderPaperList();
        }
        
        async function batchImportWorker() {
            while (batchImportState.queue.length > 0 && batchImportState.running) {
                const item = batchImportState.queue.shift();
                if (!item) break;
                
                const result = await importSinglePaper(item);
                batchImportState.results.push(result);
                batchImportState.completed++;
                if (!result.success) batchImportState.failed++;
                updateBatchImportProgress();
                
                if (clientConfig.batch_import_delay > 0) {
                    await new Promise(r => setTimeout(r, clientConfig.batch_import_delay * 1000));
                }
            }
        }
        
        async function importSinglePaper(item) {
            try {
                const res = await fetch('/api/papers/extract-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: item.url })
                });
                
                if (!res.ok) {
                    return { url: item.url, title: item.title, success: false, error: `HTTP ${res.status}` };
                }
                
                // 等待解析完成
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6);
                            if (dataStr === '[DONE]') continue;
                            
                            try {
                                const data = JSON.parse(dataStr);
                                if (data.status === 'done') {
                                    return { url: item.url, title: item.title, success: true, paper_id: data.paper_id };
                                } else if (data.status === 'error') {
                                    return { url: item.url, title: item.title, success: false, error: data.message };
                                }
                            } catch {}
                        }
                    }
                }
                
                return { url: item.url, title: item.title, success: false, error: '未收到完成信号' };
            } catch (e) {
                return { url: item.url, title: item.title, success: false, error: e.message };
            }
        }
        
        function updateBatchImportProgress() {
            const progressDiv = document.getElementById('batch-import-progress');
            const { total, completed, failed, running, queue, results } = batchImportState;
            const pending = queue.length;
            const inProgress = running ? Math.min(clientConfig.max_concurrent_requests, pending + results.length - completed) : 0;
            const success = results.filter(r => r.success).length;
            
            let html = `<div style="margin-bottom:8px">`;
            html += `总计: ${total} | 完成: ${success} | 失败: ${failed} | 剩余: ${pending}`;
            html += `</div>`;
            
            // 进度条
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            html += `<div class="progress-bar" style="margin-bottom:8px"><div class="progress-bar-fill" style="width:${percent}%"></div></div>`;
            
            // 最近的结果
            const recentResults = results.slice(-5).reverse();
            if (recentResults.length > 0) {
                html += `<div style="max-height:100px;overflow-y:auto;font-size:12px;color:#656d76">`;
                for (const r of recentResults) {
                    const icon = r.success ? '✓' : '✗';
                    const color = r.success ? '#1a7f37' : '#cf222e';
                    const display = r.title || r.url;
                    const truncated = display.length > 50 ? display.substring(0, 50) + '...' : display;
                    html += `<div style="color:${color}">${icon} ${truncated}</div>`;
                }
                html += `</div>`;
            }
            
            if (!running && completed > 0) {
                const failedItems = results.filter(r => !r.success);
                if (failedItems.length > 0) {
                    html += `<details style="margin-top:8px;font-size:12px">`;
                    html += `<summary style="cursor:pointer;color:#656d76">失败列表 (${failedItems.length})</summary>`;
                    html += `<div style="margin-top:4px;max-height:150px;overflow-y:auto">`;
                    for (const r of failedItems) {
                        html += `<div style="color:#cf222e;margin:2px 0">• ${r.title || r.url}: ${r.error || '未知错误'}</div>`;
                    }
                    html += `</div></details>`;
                }
            }
            
            progressDiv.innerHTML = html;
        }

        function showUploadModal() {
            document.getElementById('empty-state').style.display = 'flex';
            document.getElementById('branches-panel').style.display = 'none';
            document.getElementById('chat-area').style.display = 'none';
            document.getElementById('current-paper-name').textContent = '上传文档';
            document.getElementById('edit-title-btn').style.display = 'none';
            document.getElementById('analyze-btn').style.display = 'none';
            document.getElementById('new-branch-dropdown').style.display = 'none';
            document.getElementById('summarize-dropdown').style.display = 'none'; document.getElementById('new-window-btn').style.display = 'none';
            currentPaperId = null;
            currentBranchId = null;
            renderPaperList();
        }

        fetchPapers();
    </script>
